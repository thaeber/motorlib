[project]
name = "motorlib"
version = "0.1.0"
description = "A simple command line tool to control stepper motors."
readme = "README.md"
authors = [
    { name = "thaeber", email = "thomas.haeber@kit.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "click==8.4.2",
    "cloup==3.1.0",
    "omegaconf==2.3.1",
    "pint==0.25.3",
    "pydantic==2.13.4",
    "pymodbus[serial]==3.15.0",
    "rich==15.0.0",
    "rich-click==1.9.8",
]

[project.scripts]
motor = "motorlib:cli.main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.4.1",
    "git-changelog>=2.9.4",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pip>=26.1.2",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-watcher>=0.6.3",
]

[tool.uv]
python-preference = "only-managed"

[tool.ruff.format]
# Prefer single quotes over double quotes.
quote-style = "single"

[tool.black]
skip-string-normalization = true

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = true
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '''^version\s*=\s*([\'\"\`])({current_version})\1'''
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/motorlib/__init__.py"

[tool.git-changelog]
convention = "angular"
in-place = false
output = "changelog.md"
provider = "github"
sections = "fix,feat,refactor,chore,style,build"
template = "angular"
